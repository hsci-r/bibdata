[package]
name = "process-wikidata"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
bzip2 = "0.6"
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# Arrow/Parquet — align with DuckDB 1.3.x
arrow = { version = "56", features = ["ipc", "prettyprint"] }
parquet = { version = "56", default-features = false, features = ["arrow", "zstd"] }

# DuckDB for final compaction (bundled)
duckdb = { version = "1.3.2", features = ["bundled"] }

# Async runtime and I/O orchestration
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

# Concurrency utilities
dashmap = "6"

[features]
default = []

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[[bin]]
name = "process-wikidata"
path = "src/raw_to_parquet/process-wikidata.rs"
