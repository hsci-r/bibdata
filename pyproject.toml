[project]
name = "bibdata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bib2>=1.5.4",
    "click>=8.1",
    "dagster>=1.10.14",
    "hereutil>=0.1.5",
    "requests>=2.32.3",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.8",
    "pytest>=8.3",
]

[tool.uv]
package = true

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dagster_assets"
registry_modules = [
    "dagster_assets.components.*",
]
